<text x="20.0" y="44.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">1</text>
<text x="26" y="44.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">{{/*</text>
<text x="20.0" y="58.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">2</text>
<text x="26" y="58.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">Builds a cronjob to restart specified workloads (deployments, s…</text>
<text x="20.0" y="72.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">3</text>
<text x="26" y="72.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">Useful for services that silently lose their database connectio…</text>
<text x="20.0" y="86.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">4</text>
<text x="26" y="86.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">in Running state while being unusable.</text>
<text x="20.0" y="100.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">5</text>
<text x="26" y="100.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">A dedicated ServiceAccount with a namespaced Role (get/patch on…</text>
<text x="20.0" y="114.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">6</text>
<text x="26" y="114.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">is created alongside the cronjob (least privilege, no kubeconfi…</text>
<text x="20.0" y="128.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">7</text>
<text x="26" y="128.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">@param .context   The caller&#x27;s context</text>
<text x="20.0" y="142.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">8</text>
<text x="26" y="142.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">@param .args      The parameters for the restarter cronjob:</text>
<text x="20.0" y="156.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">9</text>
<text x="26" y="156.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  - name            The name to give to the cronjob</text>
<text x="20.0" y="170.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">10</text>
<text x="26" y="170.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  - cron            The schedule expression &quot;0 6 * * *&quot;</text>
<text x="20.0" y="184.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">11</text>
<text x="26" y="184.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  - targets         The workloads to restart, eg &quot;deployment/ka…</text>
<text x="20.0" y="198.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">12</text>
<text x="26" y="198.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">*/}}</text>
<text x="20.0" y="212.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">13</text>
<text x="26" y="212.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">{{- define &quot;kargo.krestarter-cronjob&quot; -}}</text>
<text x="20.0" y="226.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">14</text>
<text x="26" y="226.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">apiVersion: v1</text>
<text x="20.0" y="240.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">15</text>
<text x="26" y="240.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">kind: ServiceAccount</text>
<text x="20.0" y="254.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">16</text>
<text x="26" y="254.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">metadata:</text>
<text x="20.0" y="268.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">17</text>
<text x="26" y="268.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  name: {{ .args.name }}</text>
<text x="20.0" y="282.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">18</text>
<text x="26" y="282.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  namespace: {{ .context.Release.Namespace | quote }}</text>
<text x="20.0" y="296.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">19</text>
<text x="26" y="296.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">---</text>
<text x="20.0" y="310.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">20</text>
<text x="26" y="310.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">apiVersion: rbac.authorization.k8s.io/v1</text>
<text x="20.0" y="324.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">21</text>
<text x="26" y="324.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">kind: Role</text>
<text x="20.0" y="338.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">22</text>
<text x="26" y="338.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">metadata:</text>
<text x="20.0" y="352.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">23</text>
<text x="26" y="352.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  name: {{ .args.name }}</text>
<text x="20.0" y="366.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">24</text>
<text x="26" y="366.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  namespace: {{ .context.Release.Namespace | quote }}</text>
<text x="20.0" y="380.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">25</text>
<text x="26" y="380.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">rules:</text>
<text x="20.0" y="394.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">26</text>
<text x="26" y="394.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  - apiGroups: [&quot;apps&quot;]</text>
<text x="20.0" y="408.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">27</text>
<text x="26" y="408.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">    resources: [&quot;deployments&quot;, &quot;statefulsets&quot;]</text>
<text x="20.0" y="422.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">28</text>
<text x="26" y="422.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">    verbs: [&quot;get&quot;, &quot;patch&quot;]</text>
<text x="20.0" y="436.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">29</text>
<text x="26" y="436.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">---</text>
<text x="20.0" y="450.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">30</text>
<text x="26" y="450.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">apiVersion: batch/v1</text>
<text x="20.0" y="464.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">31</text>
<text x="26" y="464.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">kind: CronJob</text>
<text x="20.0" y="478.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">32</text>
<text x="26" y="478.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">metadata:</text>
<text x="20.0" y="492.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">33</text>
<text x="26" y="492.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  name: {{ .args.name }}</text>
<text x="20.0" y="506.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">34</text>
<text x="26" y="506.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">spec:</text>
