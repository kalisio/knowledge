<text x="26" y="520.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  schedule: {{ .args.cron | quote }}</text>
<text x="20.0" y="534.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">36</text>
<text x="26" y="534.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  # A restart that overlaps the previous one would double the r…</text>
<text x="20.0" y="548.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">37</text>
<text x="26" y="548.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  concurrencyPolicy: Forbid</text>
<text x="20.0" y="562.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">38</text>
<text x="26" y="562.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  jobTemplate:</text>
<text x="20.0" y="576.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">39</text>
<text x="26" y="576.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">    spec:</text>
<text x="20.0" y="590.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">40</text>
<text x="26" y="590.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">      template:</text>
<text x="20.0" y="604.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">41</text>
<text x="26" y="604.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">        spec:</text>
<text x="20.0" y="618.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">42</text>
<text x="26" y="618.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">          serviceAccountName: {{ .args.name }}</text>
<text x="20.0" y="632.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">43</text>
<text x="26" y="632.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">          restartPolicy: Never</text>
<text x="20.0" y="646.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">44</text>
<text x="26" y="646.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">          containers:</text>
<text x="20.0" y="660.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">45</text>
<text x="26" y="660.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">            - name: restarter</text>
<text x="20.0" y="674.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">46</text>
<text x="26" y="674.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">              image: bitnami/kubectl:latest</text>
<text x="20.0" y="688.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">47</text>
<text x="26" y="688.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">              command: [&quot;/bin/sh&quot;, &quot;-c&quot;]</text>
<text x="20.0" y="702.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">48</text>
<text x="26" y="702.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">              args:</text>
<text x="20.0" y="716.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">49</text>
<text x="26" y="716.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">                - kubectl rollout restart {{ .args.targets }}</text>
<text x="20.0" y="730.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">50</text>
<text x="26" y="730.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">{{- end }}</text>
