<text x="0" y="16" font-family="Helvetica" font-size="12" font-weight="bold">kash.sh</text>
<rect x="0" y="30" width="426.0" height="848" fill="#ffffff" stroke="#666666"/>
<text x="20.0" y="44.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">1</text>
<text x="26" y="44.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">#!/usr/bin/env bash</text>
<text x="20.0" y="58.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">2</text>
<text x="26" y="58.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">set -euo pipefail</text>
<text x="20.0" y="72.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">3</text>
<text x="20.0" y="86.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">4</text>
<text x="26" y="86.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">THIS_FILE=$(readlink -f &quot;${BASH_SOURCE[0]}&quot;)</text>
<text x="20.0" y="100.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">5</text>
<text x="26" y="100.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">THIS_DIR=$(dirname &quot;$THIS_FILE&quot;)</text>
<text x="20.0" y="114.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">6</text>
<text x="20.0" y="128.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">7</text>
<text x="26" y="128.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Add ~/.local/bin to PATH: this is where the tools below are i…</text>
<text x="20.0" y="142.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">8</text>
<text x="26" y="142.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">if [[ &quot;:$PATH:&quot; != *&quot;:$HOME/.local/bin:&quot;* ]]; then</text>
<text x="20.0" y="156.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">9</text>
<text x="26" y="156.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  export PATH=&quot;$HOME/.local/bin:$PATH&quot;</text>
<text x="20.0" y="170.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">10</text>
<text x="26" y="170.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">fi</text>
<text x="20.0" y="184.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">11</text>
<text x="20.0" y="198.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">12</text>
<text x="26" y="198.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Install yq in ~/.local/bin</text>
<text x="20.0" y="212.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">13</text>
<text x="26" y="212.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Arg1: a writable folder where to write downloaded files</text>
<text x="20.0" y="226.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">14</text>
<text x="26" y="226.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">install_yq() {</text>
<text x="20.0" y="240.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">15</text>
<text x="26" y="240.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  local DL_PATH=&quot;$1&quot;</text>
<text x="20.0" y="254.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">16</text>
<text x="26" y="254.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  local YQ_VERSION=4.40.5</text>
<text x="20.0" y="268.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">17</text>
<text x="26" y="268.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  curl -OLsS &quot;https://github.com/mikefarah/yq/releases/download…</text>
<text x="20.0" y="282.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">18</text>
<text x="26" y="282.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  mv yq_linux_amd64 ~/.local/bin/yq</text>
<text x="20.0" y="296.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">19</text>
<text x="26" y="296.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  chmod a+x ~/.local/bin/yq</text>
<text x="20.0" y="310.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">20</text>
<text x="26" y="310.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">}</text>
<text x="20.0" y="324.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">21</text>
<text x="20.0" y="338.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">22</text>
<text x="26" y="338.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Call this to ensure yq is available</text>
<text x="20.0" y="352.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">23</text>
<text x="26" y="352.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">ensure_yq() {</text>
<text x="20.0" y="366.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">24</text>
<text x="26" y="366.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  if ! command -v yq &gt;/dev/null 2&gt;&amp;1; then</text>
<text x="20.0" y="380.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">25</text>
<text x="26" y="380.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">    install_yq &quot;$TMP_DIR&quot;</text>
<text x="20.0" y="394.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">26</text>
<text x="26" y="394.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  fi</text>
<text x="20.0" y="408.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">27</text>
<text x="26" y="408.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">}</text>
<text x="20.0" y="422.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">28</text>
<text x="20.0" y="436.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">29</text>
<text x="26" y="436.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">### Secrets</text>
<text x="20.0" y="450.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">30</text>
<text x="20.0" y="464.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">31</text>
<text x="26" y="464.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Load the variables of one or more .enc.env files into the env…</text>
<text x="20.0" y="478.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">32</text>
<text x="26" y="478.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># decrypting them with sops on the fly. Nothing is written to d…</text>
<text x="20.0" y="492.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">33</text>
<text x="26" y="492.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Arg1..N: the files to load</text>
<text x="20.0" y="506.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">34</text>
<text x="26" y="506.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">load_env_files() {</text>
<text x="20.0" y="520.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">35</text>
<text x="26" y="520.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  for FILE in &quot;$@&quot;; do</text>
<text x="20.0" y="534.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">36</text>
<text x="26" y="534.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">    if [ -f &quot;$FILE&quot; ]; then</text>
<text x="20.0" y="548.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">37</text>
<text x="26" y="548.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">      set -a</text>
<text x="20.0" y="562.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">38</text>
<text x="26" y="562.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">      # shellcheck disable=SC1090</text>
<text x="20.0" y="576.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">39</text>
<text x="26" y="576.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">      . &lt;(sops --decrypt &quot;$FILE&quot;)</text>
<text x="20.0" y="590.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">40</text>
<text x="26" y="590.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">      set +a</text>
<text x="20.0" y="604.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">41</text>
<text x="26" y="604.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">    fi</text>
<text x="20.0" y="618.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">42</text>
<text x="26" y="618.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  done</text>
<text x="20.0" y="632.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">43</text>
<text x="26" y="632.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">}</text>
<text x="20.0" y="646.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">44</text>
<text x="20.0" y="660.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">45</text>
<text x="26" y="660.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Report the outcome of a CI step to a slack channel.</text>
<text x="20.0" y="674.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">46</text>
<text x="26" y="674.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Arg1: the repository root</text>
<text x="20.0" y="688.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">47</text>
<text x="26" y="688.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Arg2: the step name</text>
<text x="20.0" y="702.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">48</text>
<text x="26" y="702.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Arg3: the exit code</text>
<text x="20.0" y="716.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">49</text>
<text x="26" y="716.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Arg4: the webhook url</text>
<text x="20.0" y="730.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">50</text>
<text x="26" y="730.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">slack_ci_report() {</text>
<text x="20.0" y="744.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">51</text>
<text x="26" y="744.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  local ROOT_DIR=&quot;$1&quot;</text>
<text x="20.0" y="758.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">52</text>
<text x="26" y="758.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  local STEP=&quot;$2&quot;</text>
<text x="20.0" y="772.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">53</text>
<text x="26" y="772.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  local STATUS=&quot;$3&quot;</text>
<text x="20.0" y="786.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">54</text>
<text x="26" y="786.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  local WEBHOOK=&quot;$4&quot;</text>
<text x="20.0" y="800.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">55</text>
<text x="26" y="800.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  local COLOR=&quot;good&quot;</text>
<text x="20.0" y="814.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">56</text>
<text x="26" y="814.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  if [ &quot;$STATUS&quot; -ne 0 ]; then COLOR=&quot;danger&quot;; fi</text>
<text x="20.0" y="828.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">57</text>
<text x="26" y="828.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  curl -sS -X POST -H &#x27;Content-type: application/json&#x27; \</text>
<text x="20.0" y="842.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">58</text>
<text x="26" y="842.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">    --data &quot;{\&quot;attachments\&quot;:[{\&quot;color\&quot;:\&quot;$COLOR\&quot;,\&quot;text\&quot;:\&quot;…</text>
<text x="20.0" y="856.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">59</text>
<text x="26" y="856.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">    &quot;$WEBHOOK&quot;</text>
<text x="20.0" y="870.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">60</text>
<text x="26" y="870.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">}</text>
