sonar.projectKey=kalisio-knowledge
sonar.sources=api,ingestion
sonar.tests=test
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/docs/**
sonar.coverage.exclusions=**/test/**,**/logs/**,**/bin.py,**/docs/**
sonar.python.coverage.reportPaths=coverage.xml
# Each image ships only its own service directory (see the .dockerignore
# files), so the environment helpers and the logger setup are written twice
# on purpose rather than shared through a third package.
sonar.cpd.exclusions=api/config.py,ingestion/config.py,api/logger.py,ingestion/logger.py
