[project]
name = "knowledge"
version = "0.1.0"
description = "RAG experiments and knowledge retrieval tooling for local development"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai>=1.0.0",
    "einops>=0.8.0",
    "fastapi>=0.115.0",
    "langchain-text-splitters>=1.1.0",
    "python-dotenv>=1.1.0",
    "chromadb>=1.0.0",
    "lancedb>=0.17.0",
    "qdrant-client>=1.17.1",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
    "sentence-transformers>=5.3.0",
    "transformers>=4.51.0,<6.0.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.30.0",
    "safetensors>=0.4.5",
    "accelerate>=1.0.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "uvicorn>=0.30.0",
    "PyJWT>=2.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["api*", "ingestion*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "golden: end-to-end retrieval tests requiring the embedding model and KDK docs",
]
