[project]
name = "knowledge"
version = "0.1.0"
description = "AI developer assistant for the Kalisio ecosystem"

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
  "General: General tests for the API",
]

[tool.ruff]
exclude = ["docs/experiments"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
patch = ["subprocess"]
