[project]
name = "knowledge"
version = "0.1.0"
description = "A retrieval-augmented generation (RAG) engine specialised in the Kalisio ecosystem"
requires-python = ">=3.11,<3.14"

# What api/ and ingestion/ import, and nothing else: this is what the two
# Docker images install (`uv sync --no-dev`).
dependencies = [
  # Served from the CPU index below: the PyPI build pulls 2.7 GB of
  # nvidia/* wheels plus 691 MB of triton, for a GPU the pods do not have.
  "torch==2.13.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "openai>=1.0.0",
  "PyJWT>=2.8.0",
  "qdrant-client>=1.17.1",
  "langchain-text-splitters>=1.1.0",
  "sentence-transformers>=5.3.0",
  "transformers>=4.51.0,<6.0.0",
  # The Marian tokenizer used for query translation is SentencePiece-based;
  # transformers raises without it.
  "sentencepiece>=0.2.0",
]

[dependency-groups]
# The test suite and the linter, what the CI installs (`setup_python_env -g test`).
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  # FastAPI's TestClient.
  "httpx>=0.27.0",
]
# The research scripts under docs/experiments: the other vector stores and
# the lexical baseline they were compared with.
research = [
  "chromadb>=1.0.0",
  "lancedb>=0.17.0",
  "rank-bm25>=0.2.2",
  "pandas>=2.2.0",
  "python-dotenv>=1.1.0",
  "requests>=2.32.5",
  "einops>=0.8.0",
  "accelerate>=1.0.0",
]

[tool.uv]
# A developer gets the tests and the linter with a plain `uv sync`.
default-groups = ["test"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["test"]
# api/ and ingestion/ are imported from the repository root, without an install.
pythonpath = ["."]
# The two services are mirrored under test/, so the same file name lives in
# test/api and test/ingestion. importlib keeps them apart without turning
# the test tree into packages.
addopts = "--import-mode=importlib"
markers = [
  "General: General tests for the API",
  "Startup: End-to-end tests for starting the API",
  "Ingestion: End-to-end tests for the ingestion job",
  "Incremental: End-to-end tests for re-running the ingestion job",
  "Robustness: End-to-end tests for non-nominal files and configurations",
  "Contract: End-to-end tests for the /search response contract",
  "Multilingual: Cross-lingual retrieval quality, measured with the real embedding model",
]

[tool.ruff]
exclude = ["docs/experiments"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
patch = ["subprocess"]
