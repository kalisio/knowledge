[project]
name = "knowledge"
version = "0.1.0"
description = "RAG experiments and knowledge retrieval tooling for local development"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.52.0",
    "einops>=0.8.0",
    "langchain-text-splitters>=1.1.0",
    "python-dotenv>=1.1.0",
    "qdrant-client>=1.17.1",
    "requests>=2.32.5",
    "sentence-transformers>=5.3.0",
]

[tool.pytest.ini_options]
markers = [
    "golden: end-to-end retrieval tests requiring the embedding model and KDK docs",
]
