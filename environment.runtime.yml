name: knowledge
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # torch pulls the CUDA runtime from PyPI by default: 2.7 GB of
      # nvidia/* wheels plus 691 MB of triton, for a GPU the pods do not
      # have (torch.cuda.is_available() is False in the container). The
      # +cpu build off the PyTorch index carries none of it.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.13.0+cpu
      # What api/ and ingestion/ actually import. The research notebooks
      # need much more (chromadb, lancedb, pandas, ...) and keep using
      # environment.yml, which is also what the test suite runs on.
      - fastapi>=0.115.0
      - uvicorn>=0.30.0
      - openai>=1.0.0
      - PyJWT>=2.8.0
      - qdrant-client>=1.17.1
      - langchain-text-splitters>=1.1.0
      - sentence-transformers>=5.3.0
      - transformers>=4.51.0,<6.0.0
