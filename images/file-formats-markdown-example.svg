<text x="20.0" y="44.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">1</text>
<text x="26" y="44.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000"># Layer catalog</text>
<text x="20.0" y="58.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">2</text>
<text x="20.0" y="72.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">3</text>
<text x="26" y="72.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">The catalog service stores the layer descriptors an application…</text>
<text x="20.0" y="86.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">4</text>
<text x="26" y="86.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">its users. Each descriptor is a GeoJSON-friendly document descr…</text>
<text x="20.0" y="100.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">5</text>
<text x="26" y="100.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">the data comes from and how it must be rendered on the map.</text>
<text x="20.0" y="114.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">6</text>
<text x="20.0" y="128.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">7</text>
<text x="26" y="128.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">## Installation</text>
<text x="20.0" y="142.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">8</text>
<text x="20.0" y="156.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">9</text>
<text x="26" y="156.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">Install the module and register the service in your application:</text>
<text x="20.0" y="170.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">10</text>
<text x="20.0" y="184.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">11</text>
<text x="26" y="184.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">```js</text>
<text x="20.0" y="198.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">12</text>
<text x="26" y="198.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">import { catalog } from &#x27;@kalisio/kdk/map.api.js&#x27;</text>
<text x="20.0" y="212.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">13</text>
<text x="20.0" y="226.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">14</text>
<text x="26" y="226.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">export default function () {</text>
<text x="20.0" y="240.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">15</text>
<text x="26" y="240.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  const app = this</text>
<text x="20.0" y="254.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">16</text>
<text x="26" y="254.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">  app.configure(catalog)</text>
<text x="20.0" y="268.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">17</text>
<text x="26" y="268.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">}</text>
<text x="20.0" y="282.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">18</text>
<text x="26" y="282.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">```</text>
<text x="20.0" y="296.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">19</text>
<text x="20.0" y="310.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">20</text>
<text x="26" y="310.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">## Configuration</text>
<text x="20.0" y="324.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">21</text>
<text x="20.0" y="338.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">22</text>
<text x="26" y="338.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">A descriptor is made of a `name`, a `type` and a rendering sect…</text>
<text x="20.0" y="352.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">23</text>
<text x="26" y="352.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">renderer is picked from the `leaflet` or `cesium` key, so the v…</text>
<text x="20.0" y="366.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">24</text>
<text x="26" y="366.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">descriptor drives both the 2D map and the 3D globe without any …</text>
<text x="20.0" y="380.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">25</text>
<text x="26" y="380.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">the application side. Descriptors are validated against the cat…</text>
<text x="20.0" y="394.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">26</text>
<text x="26" y="394.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">before they are stored, which means a malformed renderer is rej…</text>
<text x="20.0" y="408.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">27</text>
<text x="26" y="408.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">creation time rather than failing silently when the layer is di…</text>
<text x="20.0" y="422.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">28</text>
<text x="20.0" y="436.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">29</text>
<text x="26" y="436.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">### Zoom levels</text>
<text x="20.0" y="450.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">30</text>
<text x="20.0" y="464.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">31</text>
<text x="26" y="464.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">Set `minZoom` and `maxZoom` to restrict the zoom range a layer …</text>
<text x="20.0" y="478.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">32</text>
<text x="26" y="478.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">at. Outside of that range the layer stays in the catalog but is…</text>
<text x="20.0" y="492.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">33</text>
<text x="20.0" y="506.1" text-anchor="end" font-family="Courier New" font-size="10" fill="#999999">34</text>
<text x="26" y="506.1" font-family="Courier New" font-size="10" xml:space="preserve" fill="#000000">## Troubleshooting</text>
